    <path d="m173 380 79 67m156-67-79 67" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

    <!-- Open Mushaf: warm pages with a strong central fold -->
    <path d="M112 322q70-31 143 8v112q-72-41-143-8z" fill="#8c5418" stroke="#f1bd48" stroke-width="7" stroke-linejoin="round"/>
    <path d="M399 322q-70-31-143 8v112q72-41 143-8z" fill="#8c5418" stroke="#f1bd48" stroke-width="7" stroke-linejoin="round"/>
    <path d="M122 314q65-26 133 12v100q-67-35-133-6z" fill="url(#page)" stroke="#fff1b5" stroke-width="4" stroke-linejoin="round"/>
    <path d="M390 314q-65-26-133 12v100q67-35 133-6z" fill="url(#page)" stroke="#fff1b5" stroke-width="4" stroke-linejoin="round"/>
    <path d="M256 327v101" stroke="#b78228" stroke-width="5"/>
    <path d="M139 326q48-14 100 10m-99 11q47-13 99 10m-98 12q44-11 92 9m-88 11q40-9 83 8M373 326q-48-14-100 10m99 11q-47-13-99 10m98 12q-44-11-92 9m88 11q-40-9-83 8" fill="none" stroke="#34714b" stroke-width="3" stroke-linecap="round" opacity=".78"/>
