    <path d="M176 321v-52q0-19 13-30 13 11 13 30v52m121 0v-52q0-19 13-30 13 11 13 30v52" fill="#082b23" stroke="#f0c65e" stroke-width="4"/>
    <path d="M184 320v-47q5-8 10 0v47m129 0v-47q5-8 10 0v47" fill="none" stroke="#e7bc54" stroke-width="4"/>
