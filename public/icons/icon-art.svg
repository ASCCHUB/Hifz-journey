    <path d="M163 322v-61h20v-47h12v-23h8v23h12v47h13v-16h16v-13h12v13h16v16h13v-47h12v-23h8v23h12v47h20v61Z" fill="#b57b20" stroke="#e8bd58" stroke-width="4" stroke-linejoin="round"/>
    <path d="M207 321v-72q0-49 49-75 49 26 49 75v72Z" fill="url(#gold)" stroke="#ffe79a" stroke-width="5"/>
    <path d="M221 321v-66q0-35 35-57 35 22 35 57v66Z" fill="#0b4933" stroke="#a97420" stroke-width="4"/>
