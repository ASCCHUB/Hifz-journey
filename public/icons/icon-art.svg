  <rect x="18" y="18" width="476" height="476" rx="108" fill="none" stroke="url(#gold)" stroke-width="9"/>
  <rect x="27" y="27" width="458" height="458" rx="100" fill="none" stroke="#fff0ad" stroke-width="2" opacity=".72"/>
