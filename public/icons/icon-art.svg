<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Hifz Journey">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#061b2a"/>
      <stop offset=".52" stop-color="#06372c"/>
      <stop offset="1" stop-color="#06251f"/>
    </linearGradient>
    <linearGradient id="gold" x1=".15" y1="0" x2=".85" y2="1">
      <stop stop-color="#fff1aa"/>
      <stop offset=".28" stop-color="#e9bc50"/>
      <stop offset=".62" stop-color="#c48622"/>
      <stop offset="1" stop-color="#ffe28a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff9df"/>
      <stop offset="1" stop-color="#ead99c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#e7b944" stop-opacity=".36"/>
      <stop offset="1" stop-color="#e7b944" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="112" height="112" patternUnits="userSpaceOnUse">
      <path d="M56 5 68 39 103 27 81 56 103 85 68 73 56 107 44 73 9 85 31 56 9 27 44 39Z" fill="none" stroke="#d3a43d" stroke-width="3" opacity=".18"/>
      <circle cx="56" cy="56" r="5" fill="#d3a43d" opacity=".25"/>
    </pattern>
    <clipPath id="tile"><rect x="12" y="12" width="488" height="488" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#field)"/>
    <path d="M22 30h468v170H22z" fill="url(#stars)"/>
    <path d="M22 402q112-76 234 0 122-76 234 0v110H22z" fill="#021c19" opacity=".62"/>
    <path d="M28 420q114-72 228 0 114-72 228 0M28 454q114-72 228 0 114-72 228 0" fill="none" stroke="#32815c" stroke-width="8" opacity=".24"/>

